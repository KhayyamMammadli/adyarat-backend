name: Job Agent CI

on:
  push:
    branches:
      - feat/job-agent-whatsapp
      - feat/job-agent-interactive-menu
      - feat/telegram-admin-interactive
      - feat/vacancy-aggregator
      - feat/employer-location-vacancy-filters
      - feat/employer-profile-onboarding
      - feat/business-registration-moderation
      - feat/role-menu-quick-filters
      - feat/telegram-admin-statistics
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test
        run: npm test

